name: Publish OI dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "outputs/oi-dominance/data/**"
      - "outputs/oi-dominance/export-xlsx.py"
      - "outputs/oi-dominance/publish-site.mjs"
      - "outputs/oi-dominance/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: outputs/oi-dominance/requirements.txt

      - name: Install Excel exporter
        run: python -m pip install --requirement outputs/oi-dominance/requirements.txt

      - name: Build Excel download
        run: python outputs/oi-dominance/export-xlsx.py

      - name: Build public site
        run: node outputs/oi-dominance/publish-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/oi-dominance/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

